name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Restricting this to `main` meant a
  # stacked pull request — one based on another feature branch — silently got no CI
  # at all, which is worse than a red one.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  elixir:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor declared in mix.exs. If this one breaks, either the code or
          # the declared requirement is wrong — do not just drop the row.
          - elixir: "1.15.8"
            otp: "26.2"
          - elixir: "1.16.3"
            otp: "26.2"
          - elixir: "1.17.3"
            otp: "27.2"
          - elixir: "1.18.4"
            otp: "27.2"
          - elixir: "1.19.5"
            otp: "28.1"
            lint: true

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Check for unused dependencies
        if: matrix.lint
        run: mix deps.unlock --check-unused

      - name: Compile without warnings
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - run: mix test
        if: '!matrix.lint'
        env:
          MIX_ENV: test

      # One row measures coverage; the others just run the suite. `mix test
      # --cover` fails below the threshold declared in mix.exs.
      - name: Run tests with coverage
        if: matrix.lint
        run: mix test --cover
        env:
          MIX_ENV: test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      # The PLT lives in `_build/plts`, so caching `_build` caches it too. The
      # restore-keys fall back to the last PLT when mix.lock moves: dialyxir then
      # updates it in place instead of spending two minutes rebuilding it. The
      # Elixir/OTP pair is part of the key because `_build` is toolchain-specific —
      # without it, bumping the versions below would restore a build no step can
      # reuse.
      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: dialyzer-${{ runner.os }}-1.19.5-28.1-${{ hashFiles('mix.lock') }}
          restore-keys: dialyzer-${{ runner.os }}-1.19.5-28.1-

      - run: mix deps.get

      # :dev, not :test — dev/ is on the :dev elixirc_paths, so this checks the
      # playground as well as the library.
      - run: mix dialyzer --format github

  javascript:
    name: JavaScript runtime
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - run: npm ci
        working-directory: assets

      - run: npm test
        working-directory: assets

  bundles:
    name: Committed bundles match the source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - run: npm ci
        working-directory: assets

      # priv/static is committed because it is what Hex ships — an application
      # with no npm still gets a working bundle. That only holds if the committed
      # files are actually built from the current assets/js.
      - run: npm run build
        working-directory: assets

      - name: Fail if priv/static is stale
        run: |
          if ! git diff --quiet -- priv/static; then
            echo "::error::priv/static is out of date. Run 'mix assets.build' and commit the result."
            git diff --stat -- priv/static
            exit 1
          fi
          echo "Committed bundles are up to date."

  browser:
    name: Browser suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: browser-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: browser-${{ runner.os }}-

      - run: mix deps.get

      - run: npm ci
        working-directory: assets

      - name: Cache the Playwright browser
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('assets/package-lock.json') }}

      - run: npx playwright install chromium --with-deps
        working-directory: assets

      # Everything below the component — the canvas, the popup DOM, the tile URLs
      # the browser actually requests — lives where ExUnit and node --test cannot
      # look. Every rendering bug this library has shipped was in here.
      # `mix dev` is started by Playwright's webServer, which also runs the esbuild
      # watcher, so the bundle under test is built from the current source.
      - run: npm run test:browser
        working-directory: assets

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            assets/test-results
            assets/playwright-report
          retention-days: 7
